name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.55.2
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o bin/gateway ./cmd/gateway
