runners:
  default:
    timeout: 5m
    go: "1.22"

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - nilerr

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
